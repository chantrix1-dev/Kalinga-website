<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalinga — Vetted local caregivers for your parents</title>
<meta name="description" content="Scheduled caregiver visits for elderly parents in the Philippines. Local, vetted, and fully on record.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#F6F1E7;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0E2A38;-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  a{color:#0E3446;text-decoration:none}
  a:hover{color:#3E7C93}
  button{font-family:inherit;cursor:pointer}
  h1,h2,h3,p{margin:0}
  html{scroll-behavior:smooth}
  .img-slot{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:inherit;color:rgba(14,42,56,.35);font-size:12px;font-weight:600;text-align:center;padding:12px;line-height:1.4}
  .cg-strip{scrollbar-width:none}
  .cg-strip::-webkit-scrollbar{display:none}
  input:focus{border-color:#0E3446!important}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- data ---------- */
const WHO = [['nanay','Nanay'],['tatay','Tatay'],['lola','Lola'],['lolo','Lolo'],['both','Both parents']];
const AREAS = [['mm','Metro Manila'],['bulacan','Bulacan'],['other','Somewhere else']];
const NEEDS = [['meds','Medication check'],['vitals','Blood pressure & wellbeing'],['meals','Meals & hydration'],['errands','Groceries & errands'],['doctor','Doctor visit companion'],['company','Companionship']];
const DURATIONS = [
  {id:'short',label:'1–2 hour visit',sub:'A quick check-in',rate:450},
  {id:'half',label:'Half-day visit',sub:'4 hours, AM or PM',rate:950},
  {id:'full',label:'Whole-day visit',sub:'8 hours',rate:1700},
  {id:'overnight',label:'Overnight visit',sub:'12 hours, incl. night differential',rate:2200}
];
const PLANS = {
  basic:{name:'Basic',freq:'Once a week',visits:4},
  standard:{name:'Standard',freq:'Twice a week',visits:8},
  premium:{name:'Premium',freq:'Every day',visits:30}
};
const TIERS = [
  {id:'basic',code:'BASIC',tagline:'A weekly check-in',title:'Once a week',big:'1×',bigSub:'visit / week',desc:'A visit each week with the same caregiver. Good for someone who is independent but lives alone.',feats:['Checklist + photos every visit','Message your caregiver','Emergency alerts (push + SMS)']},
  {id:'standard',code:'STANDARD',tagline:'Steady, regular care',title:'Twice a week',big:'2×',bigSub:'visits / week',desc:'Two visits a week with the same caregiver. Most families choose this one.',feats:['Photos + video every visit','Backup caregiver if they cancel','Up to 4 family members linked']},
  {id:'premium',code:'PREMIUM',tagline:'Someone there daily',title:'Every day',big:'7×',bigSub:'visits / week',desc:'A visit every day of the week. For a loved one who needs a closer eye or is recovering from an illness.',feats:['Daily visits, Mon–Sun','Priority backup caregiver','Video call during visits']}
];
function peso(n){ return '₱'+Math.round(n).toLocaleString('en-PH'); }
function priceFor(tierId, durId){
  const t = PLANS[tierId] || PLANS.basic, d = DURATIONS.find(x=>x.id===durId) || DURATIONS[0];
  return t.visits * d.rate;
}
const HARDWARE = [
  {id:'tag',t:'Safety tag',b:'A GPS pendant with fall detection, an SOS button and safe-zone alerts.',price:'₱1,990',sub:'one-time, or ₱199/mo over 12 months'},
  {id:'camera',t:'Home camera',b:'Covers common areas only. Only the primary account holder can view it.',price:'₱2,490',sub:'one-time, or ₱249/mo over 12 months'},
  {id:'bodycam',t:'Caregiver body cam',b:'Worn only during visits. Footage is opened only if there is a formal dispute.',price:'₱149/mo',sub:'billed with your plan'}
];
const CAREGIVERS = [
  {name:'Joy Santos',meta:'Quezon City, Metro Manila · 6 yrs'},
  {name:'Ramon Villareal',meta:'Makati, Metro Manila · 4 yrs'},
  {name:'Grace Tan',meta:'Malolos, Bulacan · 5 yrs'},
  {name:'Arnel Bautista',meta:'Meycauayan, Bulacan · 7 yrs'},
  {name:'Marites Ocampo',meta:'Taguig, Metro Manila · 8 yrs'},
  {name:'Jenny Aquino',meta:'San Jose del Monte, Bulacan · 3 yrs'}
];
const NURSES_LIVE = false;
const VISITS = [
  {tin:'9:14',tout:'10:32',tags:['Meds taken','BP 128/82','Groceries'],note:'Nanay Remy ate all her lunch today and we walked to the sari-sari store. She asked if you will call on Saturday.',by:'Joy, visiting Nanay Remy · Quezon City'},
  {tin:'2:00',tout:'3:10',tags:['Meds taken','BP 135/86','Pharmacy'],note:'Tatay Ben picked up his refill from Mercury Drug with me. His knee was a little sore, so I let his daughter know.',by:'Arnel, visiting Tatay Ben · Meycauayan, Bulacan'},
  {tin:'8:30',tout:'9:25',tags:['Meds taken','Breakfast','Video call'],note:'Lola Cora watched the video call with her apo abroad and was so happy. She asked me to send the photo to the family.',by:'Marites, visiting Lola Cora · Taguig'}
];
const PROMISES = ['Backup caregiver','Next visit free','Cancel anytime','Locked visit records'];
const FAQS = [
  ['Who are the caregivers?','They are local caregivers, many with TESDA caregiving or nursing backgrounds, who live near your parent. Before they can take a booking, each one passes an NBI clearance, ID and reference checks, first-aid/CPR verification and an in-person interview.'],
  ['Is Kalinga a medical service?','No. Our caregivers do scheduled, non-medical check-in visits. If something looks wrong, they follow our emergency protocol. That means calling 911 when it is needed, alerting your family, and notifying our team.'],
  ['What if the caregiver can’t come?','We send a vetted backup caregiver and tell you right away. If no backup is available, your next visit is free.'],
  ['Can my siblings see the visits?','Yes. Each linked family member has their own login and gets their own alerts. Only the primary account holder can manage billing.'],
  ['How do I pay from abroad?','You can pay by card (Visa or Mastercard) or with Wise in your own currency. If you prefer pesos, you can use GCash or Maya. You are billed monthly, and every charge is listed on your invoice.'],
  ['Is my family’s information private?','Yes. Medical notes and emergency contacts are encrypted. Only your parent’s assigned caregiver and the family members you link can see them. We follow the Data Privacy Act (RA 10173).'],
  ['Where are you available?','We are starting in Metro Manila and Bulacan. If your parent lives somewhere else, start a care match anyway and we will let you know when we reach their area.'],
  ['Can I cancel or pause my plan?','Yes. You can do it anytime in the app, and the change applies from your next billing cycle.']
];
const FOOT_COLS = [
  {h:'Company',links:[{t:'About us',href:'#'},{t:'How it works',href:'#how'},{t:'Start a care match',href:'#top'},{t:'Contact',href:'mailto:hello@kalinga.ph'}]},
  {h:'Plans',links:[{t:'Basic',href:'#plans'},{t:'Standard',href:'#plans'},{t:'Premium',href:'#plans'},{t:'Safety devices',href:'#plans'}]},
  {h:'Support',links:[{t:'Become a caregiver',href:'#join'},{t:'Caregiver log in',href:'#join'},{t:'Privacy policy',href:'#'},{t:'Terms of service',href:'#'},{t:'Emergency protocol',href:'#'}]}
];
const JOIN_PERKS = ['Visits near home, scheduled around your family','Weekly pay through GCash or Maya, no agency cut','Free first-aid, CPR and dementia-care training'];
const JOIN_STEPS = [['1','Apply online','About 5 minutes. Your name, mobile number, location and experience.'],['2','Send your documents','Valid ID, NBI clearance, barangay clearance, plus your TESDA NC II or PRC license if you have one.'],['3','Interview and orientation','A short video or in-person interview, then a half-day orientation.'],['4','Start receiving visits','Log in to the Kalinga app and accept visits from families nearby.']];
const AP_DOCS = [{id:'id',t:'Valid government ID',req:true},{id:'nbi',t:'NBI clearance',req:true},{id:'brgy',t:'Barangay clearance',req:true},{id:'prc',t:'PRC nursing license',req:true},{id:'tesda',t:'TESDA Caregiving NC II',req:false},{id:'cpr',t:'First-aid or CPR certificate',req:false}];

/* ---------- state ---------- */
const blankAp = () => ({open:false,step:0,role:'caregiver',name:'',phone:'',city:'',yrs:null,docs:[],err:'',ref:''});
const blankLg = () => ({role:'family',id:'',pw:'',code:'',mode:'form',err:'',info:'',loading:false});
const blankQ = () => ({step:0,who:null,area:null,needs:[],plan:null,duration:null,addons:[],name:'',email:'',phone:'',country:'',tos:false,err:'',sending:false});

let state = {
  wide: window.innerWidth >= 900,
  scrolled: window.scrollY > 520,
  quizOpen:false, q:blankQ(),
  loginOpen:false, lg:blankLg(),
  ap:blankAp(),
  faqOpen:-1,
  addons:[],
  pv:{open:false, tierId:null, duration:null, addons:[]}
};
let _t;

function setState(patch){ state = {...state, ...(typeof patch==='function'?patch(state):patch)}; render(); }
function setQ(p){ setState(s=>({q:{...s.q, err:'', ...(typeof p==='function'?p(s.q):p)}})); }
function setAp(p){ setState(s=>({ap:{...s.ap, err:'', ...(typeof p==='function'?p(s.ap):p)}})); }
function setLg(p){ setState(s=>({lg:{...s.lg, err:'', ...(typeof p==='function'?p(s.lg):p)}})); }

function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- actions ---------- */
function openQuiz(plan){ setState(s=>({quizOpen:true, q:{...blankQ(), plan:plan||null, addons:[...s.addons]}})); }
function hwToggle(id){ setState(s=>({addons: s.addons.includes(id) ? s.addons.filter(x=>x!==id) : [...s.addons, id]})); }
function openPV(tierId){ setState(s=>({pv:{open:true, tierId, duration:null, addons:[...s.addons]}})); }
function closePV(){ setState(s=>({pv:{...s.pv, open:false}})); }
function pvDuration(id){ setState(s=>({pv:{...s.pv, duration:id}})); }
function pvAddon(id){ setState(s=>({pv:{...s.pv, addons: s.pv.addons.includes(id) ? s.pv.addons.filter(x=>x!==id) : [...s.pv.addons, id]}})); }
function pvContinue(){
  setState(s=>({
    pv:{...s.pv, open:false},
    addons:[...s.pv.addons],
    quizOpen:true,
    q:{...blankQ(), plan:s.pv.tierId, duration:s.pv.duration, addons:[...s.pv.addons]}
  }));
}
function closeQuiz(){ setState({quizOpen:false}); }
function openLogin(){ setState({loginOpen:true, lg:blankLg()}); }
function closeLogin(){ setState({loginOpen:false}); }
function openApply(){ setState({ap:{...blankAp(), open:true}}); }
function closeApply(){ setState(s=>({ap:{...s.ap, open:false}})); }
function openCgLogin(){ setState({loginOpen:true, lg:{...blankLg(), role:'caregiver'}}); }

function quizNext(){
  const q = state.q;
  if (q.step===0 && (!q.who || !q.area)) return setQ({err:"Choose who we're visiting and where they live."});
  if (q.step===1 && !q.needs.length) return setQ({err:'Choose at least one.'});
  if (q.step===2 && !q.plan) return setQ({err:'Choose how often.'});
  if (q.step===2 && !q.duration) return setQ({err:'Choose how long each visit should be.'});
  if (q.step===3){
    if (!q.name.trim() || !q.email.trim() || !q.phone.trim() || !q.country.trim()) return setQ({err:'Please fill in every field.'});
    if (!/^\S+@\S+\.\S+$/.test(q.email.trim())) return setQ({err:'Check your email address.'});
    if (!q.tos) return setQ({err:'Please agree to the Terms to continue.'});
    setQ({sending:true});
    clearTimeout(_t);
    _t = setTimeout(()=>{
      try{
        const list = JSON.parse(localStorage.getItem('kalinga_matches')||'[]');
        list.push({...q, ts:new Date().toISOString()});
        localStorage.setItem('kalinga_matches', JSON.stringify(list));
      }catch(e){}
      setQ({sending:false, step:4});
    }, 1200);
    return;
  }
  setQ({step:q.step+1});
}
function quizBack(){ setQ(q=>({step:Math.max(0,q.step-1)})); }

function apNext(){
  const a = state.ap;
  if (a.step===0){
    if (a.name.trim().split(/\s+/).length < 2) return setAp({err:'Enter your first and last name.'});
    if (a.phone.replace(/\D/g,'').length < 10) return setAp({err:'Enter a valid mobile number.'});
    if (!a.city.trim()) return setAp({err:'Enter your city or municipality.'});
    if (!a.yrs) return setAp({err:'Choose your years of experience.'});
    return setAp({step:1});
  }
  const need = AP_DOCS.filter(d=>d.req && (d.id!=='prc' || a.role==='nurse')).map(d=>d.id);
  if (need.some(id=>!a.docs.includes(id))) return setAp({err:'Upload all required documents.'});
  setAp({step:2, ref:'CG-'+String(Date.now()).slice(-5)});
}
function apBack(){ setAp({step:0}); }
function apToggleDoc(id, on, docs){ setAp({docs: on ? docs.filter(x=>x!==id) : [...docs, id]}); }

function submitLogin(){
  const lg = state.lg;
  if (!lg.id.trim()) return setLg({err:'Enter your email or mobile number.'});
  if (lg.pw.length < 6) return setLg({err:'Password must be at least 6 characters.'});
  finishLogin();
}
function finishLogin(){
  const lg = state.lg;
  setLg({loading:true, mode:'loading', info:''});
  try{ localStorage.setItem('kalinga_session', JSON.stringify({id:lg.id.trim(), role:lg.role, ts:new Date().toISOString()})); }catch(e){}
  clearTimeout(_t);
  _t = setTimeout(()=>{ alert('Demo: this would continue into the Kalinga app (' + (lg.role==='caregiver'?'caregiver':'family') + ' view).'); setState({loginOpen:false}); }, 700);
}
function sendOtp(){ state.lg.id.trim() ? setLg({mode:'otp', info:''}) : setLg({err:'Enter your email or mobile number first.'}); }
function verifyOtp(){ state.lg.code.length===6 ? finishLogin() : setLg({err:'Enter the 6-digit code.'}); }
function lgBack(){ setLg({mode:'form', code:''}); }
function forgotPw(){ state.lg.id.trim() ? setLg({info:'Reset link sent to '+state.lg.id.trim()+'.'}) : setLg({err:'Enter your email or mobile number first.'}); }
function lgNew(){ state.lg.role==='caregiver' ? setState({loginOpen:false, ap:{...blankAp(), open:true}}) : setState({loginOpen:false, quizOpen:true, q:blankQ()}); }
function apToApp(){ try{ localStorage.setItem('kalinga_session', JSON.stringify({id:state.ap.phone, role:'caregiver', applicant:true, ts:new Date().toISOString()})); }catch(e){} alert('Demo: this would continue into the caregiver app.'); }

/* ---------- small render helpers ---------- */
function pill(label,on,onClick,extra){
  return `<button data-act="${onClick}" ${extra||''} style="height:48px;padding:0 20px;border-radius:999px;border:1.5px solid ${on?'#0E3446':'#DED6C7'};background:${on?'#0E3446':'#FFFFFF'};color:${on?'#FFFFFF':'#0E3446'};font-size:15px;font-weight:600">${esc(label)}</button>`;
}

/* ---------- render ---------- */
function render(){
  const s = state, q = s.q, lg = s.lg, a = s.ap;
  const plan = PLANS[q.plan] || PLANS.standard;
  const barCta = s.scrolled && s.wide;

  const html = `
  <div style="min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden">

  <header style="position:sticky;top:0;z-index:30;background:rgba(246,241,231,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(14,52,70,.08)">
    <div style="max-width:1200px;margin:0 auto;padding:0 24px;height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px">
      <a href="#top" style="font-size:26px;font-weight:700;letter-spacing:-.03em;color:#0E3446">kalinga</a>
      ${s.wide && !s.scrolled ? `
      <nav style="display:flex;gap:30px;font-size:15px;font-weight:600">
        <a href="#how">How it works</a><a href="#visits">Visits</a><a href="#plans">Plans</a><a href="#faq">FAQs</a>
      </nav>` : barCta ? `
      <div style="display:flex;align-items:center;gap:14px">
        ${s.wide?`<span style="font-size:14px;font-weight:600">Find a caregiver for your parent</span>`:''}
        <button data-act="openQuiz" style="height:38px;padding:0 18px;border-radius:999px;border:none;background:#0E3446;color:#FFFFFF;font-size:14px;font-weight:700">Start care match</button>
      </div>` : `<span></span>`}
      <div style="display:flex;justify-content:flex-end;align-items:center;gap:18px;font-size:15px;font-weight:600">
        <a href="#join" style="color:#3E7C93;font-size:15px;font-weight:600;text-decoration:none">For caregivers</a>
        <button data-act="openLogin" style="background:none;border:none;padding:8px 0;font-size:15px;font-weight:600;color:#0E3446">Log in</button>
      </div>
    </div>
  </header>

  <section id="top" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));background:#F6F1E7">
    <div style="padding:clamp(48px,7vw,96px) clamp(24px,6vw,96px);display:flex;flex-direction:column;justify-content:center;gap:24px;max-width:680px;width:100%">
      <span style="font-size:12px;font-weight:700;letter-spacing:.14em;color:#3E7C93">KALINGA · VETTED LOCAL CAREGIVERS</span>
      <h1 style="font-size:clamp(38px,4.8vw,60px);font-weight:600;line-height:1.08;letter-spacing:-.03em;color:#0E3446">Far from <em style="font-style:italic;color:#3E7C93">home</em>.<br>Never far from <em style="font-style:italic;color:#3E7C93">family</em>.</h1>
      <p style="font-size:17px;line-height:1.65;color:#2F4A57;max-width:500px">Answer a 2-minute care match and we'll match your loved one with an NBI-cleared caregiver who lives nearby. They visit on the schedule you choose. After every visit you'll see GPS check-in times, photos and notes, no matter where in the world you are. Backed by our <strong style="color:#0E3446">missed-visit guarantee</strong>.</p>
      <div style="display:flex;flex-direction:column;gap:14px;align-items:flex-start">
        <button data-act="openQuiz" style="height:56px;padding:0 30px;border-radius:999px;border:none;background:#0E3446;color:#FFFFFF;font-size:16px;font-weight:700;box-shadow:0 8px 24px rgba(14,52,70,.25)">Start my care match →</button>
        <span style="font-size:14px;color:#2F4A57"><strong style="color:#0E3446">Founding-family pricing</strong> · No contract, cancel anytime</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:10px 24px;font-size:14px;color:#2F4A57">
        ${['NBI-cleared caregivers','GPS-verified visits','Backup if they cancel'].map(d=>`<span style="display:flex;align-items:center;gap:8px"><span style="width:6px;height:6px;border-radius:50%;background:#3E7C93"></span>${esc(d)}</span>`).join('')}
      </div>
    </div>
    <div style="position:relative;min-height:520px;background:#CFE3E8">
      <div class="img-slot"></div>
      <div style="position:absolute;left:24px;bottom:24px;background:rgba(255,255,255,.95);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 32px rgba(14,42,56,.18);max-width:320px;pointer-events:none">
        <div style="width:42px;height:42px;border-radius:50%;background:#0E3446;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0">JS</div>
        <div style="display:flex;flex-direction:column;gap:2px">
          <span style="font-size:14px;font-weight:700;color:#0E3446">Visit logged · 9:14 AM</span>
          <span style="font-size:13px;color:#2F4A57;line-height:1.4">Joy checked in at Nanay Remy's. GPS verified.</span>
        </div>
      </div>
    </div>
  </section>

  <section id="caregivers" style="background:linear-gradient(180deg,#0E3446 0%,#1F5A70 55%,#3E7C93 100%);color:#FFFFFF;padding:72px 0 80px">
    <div style="max-width:1200px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center">
      <span style="font-size:12px;font-weight:700;letter-spacing:.14em;color:#BFDCE4">MEET THE CAREGIVERS</span>
      <h2 style="font-size:clamp(30px,4vw,46px);font-weight:600;letter-spacing:-.03em;line-height:1.1">The people visiting <em style="font-style:italic;color:#F2B872">your family</em>.</h2>
      <p style="font-size:16px;line-height:1.6;color:#DCEBEF;max-width:520px">We're onboarding local, NBI-cleared caregivers across Metro Manila and Bulacan. Each one is interviewed, cleared and trained by our team before their first booking.</p>
    </div>
    <div class="cg-strip" style="display:flex;justify-content:center;gap:16px;overflow-x:auto;padding:36px 24px 8px;max-width:1200px;margin:0 auto">
      ${Array.from({length:5}).map(()=>`
      <div style="flex:0 0 220px;height:300px;border-radius:20px;overflow:hidden;position:relative;background:rgba(255,255,255,.06);border:1.5px dashed rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px">
        <svg width="72" height="72" viewBox="0 0 72 72" fill="none" style="opacity:.55">
          <circle cx="36" cy="36" r="36" fill="rgba(255,255,255,.1)"/>
          <circle cx="36" cy="28" r="13" fill="rgba(255,255,255,.4)"/>
          <path d="M10 66c3-15 14-23 26-23s23 8 26 23" fill="rgba(255,255,255,.4)"/>
        </svg>
        <span style="font-size:14px;font-weight:700;color:#DCEBEF">Coming soon</span>
      </div>`).join('')}
    </div>
  </section>

  <section id="how" style="max-width:1200px;width:100%;margin:0 auto;padding:88px 24px;display:flex;flex-direction:column;align-items:center;gap:40px">
    <h2 style="font-size:clamp(30px,4vw,46px);font-weight:600;letter-spacing:-.03em;line-height:1.12;text-align:center;color:#0E3446">3 simple steps to<br><em style="font-style:italic;color:#3E7C93">peace of mind</em>, from anywhere.</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;width:100%;max-width:1000px">
      <div style="background:#FFFFFF;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 12px rgba(14,42,56,.06)">
        <span style="width:30px;height:30px;border-radius:50%;background:#E3EFF2;color:#0E3446;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">01</span>
        <h3 style="font-size:18px;font-weight:700;color:#0E3446">2-minute care match</h3>
        <p style="font-size:15px;line-height:1.6;color:#2F4A57">Tell us who needs care, where they live, and what each visit should cover.</p>
        <div style="margin-top:12px;height:170px;border-radius:16px;background:#F6F1E7;display:flex;align-items:flex-end;justify-content:center;overflow:hidden">
          <div style="width:118px;height:150px;background:#FFFFFF;border:5px solid #0E3446;border-bottom:none;border-radius:18px 18px 0 0;padding:12px 10px;display:flex;flex-direction:column;gap:6px">

        <span style="font-size:15px;font-weight:700;color:#0E3446;padding-top:6px">Where do they live?</span>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          ${AREAS.map(([id,label])=>`<button data-act="qArea" data-arg="${id}" style="height:48px;padding:0 20px;border-radius:999px;border:1.5px solid ${q.area===id?'#0E3446':'#DED6C7'};background:${q.area===id?'#0E3446':'#FFFFFF'};color:${q.area===id?'#FFFFFF':'#0E3446'};font-size:15px;font-weight:600">${label}</button>`).join('')}
        </div>`:''}
        ${(q.step===1 && !q.sending)?`
        <h3 style="font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.15;color:#0E3446">What should visits <em style="font-style:italic;color:#3E7C93">cover</em>?</h3>
        <span style="font-size:14px;color:#5C7480">Choose all that apply.</span>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${NEEDS.map(([id,label])=>{ const on=q.needs.includes(id); return `
          <button data-act="qNeed" data-arg="${id}" style="min-height:52px;border-radius:16px;border:1.5px solid ${on?'#0E3446':'#DED6C7'};background:#FFFFFF;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;color:#0E3446;padding:0 16px">
            <span style="font-size:15px;font-weight:600">${label}</span>
            <span style="width:22px;height:22px;border-radius:50%;border:1.5px solid #0E3446;background:${on?'#0E3446':'#FFFFFF'};color:#FFFFFF;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0">${on?'✓':''}</span>
          </button>`; }).join('')}
        </div>`:''}
        ${(q.step===2 && !q.sending)?`
        <h3 style="font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.15;color:#0E3446">How <em style="font-style:italic;color:#3E7C93">often</em> should someone visit?</h3>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${Object.entries(PLANS).map(([id,p])=>`
          <button data-act="qPlan" data-arg="${id}" style="min-height:60px;border-radius:18px;border:1.5px solid ${q.plan===id?'#0E3446':'#DED6C7'};background:${q.plan===id?'#0E3446':'#FFFFFF'};display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;color:${q.plan===id?'#FFFFFF':'#0E3446'};padding:0 18px">
            <span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:700">${p.name}</span><span style="font-size:13px;opacity:.85">${p.freq}</span></span>
          </button>`).join('')}
        </div>
        <span style="font-size:15px;font-weight:700;color:#0E3446;padding-top:6px">How long should each visit be?</span>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${DURATIONS.map(d=>`
          <button data-act="qDuration" data-arg="${d.id}" style="min-height:60px;border-radius:18px;border:1.5px solid ${q.duration===d.id?'#0E3446':'#DED6C7'};background:${q.duration===d.id?'#0E3446':'#FFFFFF'};display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;color:${q.duration===d.id?'#FFFFFF':'#0E3446'};padding:0 18px">
            <span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:700">${esc(d.label)}</span><span style="font-size:13px;opacity:.85">${esc(d.sub)}</span></span>
            <span style="font-size:14px;font-weight:700">${peso(d.rate)}/visit</span>
          </button>`).join('')}
        </div>
        ${(q.plan && q.duration)?`<div style="background:#FFFFFF;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:14px;font-weight:600;color:#0E3446">Estimated plan cost</span><span style="font-size:20px;font-weight:700;color:#0E3446">${peso(priceFor(q.plan,q.duration))}/mo</span></div>`:''}`:''}
        ${(q.step===3 && !q.sending)?`
        <h3 style="font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.15;color:#0E3446">Where should we send your <em style="font-style:italic;color:#3E7C93">matches</em>?</h3>
        <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:700;color:#0E3446">Your full name</span><input id="q_name" value="${esc(q.name)}" placeholder="Maria Dela Cruz" style="height:50px;border-radius:14px;border:1.5px solid #DED6C7;background:#FFFFFF;padding:0 16px;font-size:16px;outline:none;color:#0E2A38;font-family:inherit"></label>
        <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:700;color:#0E3446">Email</span><input id="q_email" value="${esc(q.email)}" placeholder="maria@email.com" style="height:50px;border-radius:14px;border:1.5px solid #DED6C7;background:#FFFFFF;padding:0 16px;font-size:16px;outline:none;color:#0E2A38;font-family:inherit"></label>
        <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:700;color:#0E3446">Mobile number (with country code)</span><input id="q_phone" value="${esc(q.phone)}" placeholder="+971 50 123 4567" style="height:50px;border-radius:14px;border:1.5px solid #DED6C7;background:#FFFFFF;padding:0 16px;font-size:16px;outline:none;color:#0E2A38;font-family:inherit"></label>
        <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:700;color:#0E3446">Where you live now</span><input id="q_country" value="${esc(q.country)}" placeholder="Dubai, UAE" style="height:50px;border-radius:14px;border:1.5px solid #DED6C7;background:#FFFFFF;padding:0 16px;font-size:16px;outline:none;color:#0E2A38;font-family:inherit"></label>
        <button data-act="qTos" style="display:flex;gap:12px;align-items:flex-start;background:transparent;border:none;padding:4px 0 0;text-align:left;color:#0E3446">
          <span style="width:22px;height:22px;border-radius:6px;border:1.5px solid #0E3446;background:${q.tos?'#0E3446':'#FFFFFF'};color:#FFFFFF;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0">${q.tos?'✓':''}</span>
          <span style="font-size:14px;line-height:1.5">I agree to the Terms of Service and Privacy Policy, including emergency protocol consent.</span>
        </button>`:''}
        ${q.step===4?(()=>{
          const dur = DURATIONS.find(d=>d.id===q.duration) || DURATIONS[0];
          const planTotal = priceFor(q.plan, q.duration);
          const addonItems = HARDWARE.filter(h=>q.addons.includes(h.id));
          return `
        <h3 style="font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.15;color:#0E3446">Salamat, <em style="font-style:italic;color:#3E7C93">${esc(firstName)}</em>.</h3>
        <p style="font-size:16px;line-height:1.6;color:#2F4A57">We're matching caregivers for ${esc(whoLabel)} in ${esc(areaLabel)}. Within 24 hours we'll email up to 3 profiles to ${esc(q.email)}, and you choose who visits.</p>
        <div style="background:#FFFFFF;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(14,42,56,.1)">
          <div style="background:linear-gradient(160deg,#1F5A70,#0E3446);color:#FFFFFF;padding:14px 18px;font-size:12px;font-weight:700;letter-spacing:.12em">SUGGESTED PLAN</div>
          <div style="padding:16px 18px;display:flex;flex-direction:column;gap:10px">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
              <span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:18px;font-weight:700;color:#0E3446">${plan.name} · ${esc(dur.label)}</span><span style="font-size:13px;color:#5C7480">${plan.freq}</span></span>
              <span style="font-size:24px;font-weight:700;color:#0E3446">${peso(planTotal)}<span style="font-size:13px;font-weight:500;color:#5C7480">/mo</span></span>
            </div>
            ${addonItems.length?`<div style="border-top:1px solid #E7DFD0;padding-top:10px;display:flex;flex-direction:column;gap:6px">
              ${addonItems.map(h=>`<div style="display:flex;justify-content:space-between;font-size:13px;color:#0E3446"><span>${esc(h.t)}</span><span style="font-weight:700">${esc(h.price)}</span></div>`).join('')}
            </div>`:''}
          </div>
        </div>
        <span style="font-size:14px;line-height:1.55;color:#5C7480">Covers ${esc(needsSummary)}.</span>
        <div style="background:#E3EFF2;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px">
          <span style="font-size:14px;font-weight:700;color:#0E3446">What happens next</span>
          <span style="font-size:13px;line-height:1.6;color:#2F4A57">The Kalinga app isn't live yet. We'll reach you by email and SMS at ${esc(q.phone || 'the number you gave')} with your caregiver matches and payment link — no app needed to get started.</span>
        </div>
        <button data-act="closeQuiz" style="height:54px;border-radius:999px;background:#0E3446;color:#FFFFFF;font-size:16px;font-weight:700">Done</button>`;
        })():''}
        ${q.sending?`<p style="font-size:24px;font-weight:600;line-height:1.3;padding:32px 0;color:#0E3446">Finding caregivers near <em style="font-style:italic;color:#3E7C93">${esc(areaLabel)}</em>…</p>`:''}
        ${q.err?`<span style="color:#B3261E;font-size:14px;font-weight:700">${esc(q.err)}</span>`:''}
      </div>
      ${(q.step<4 && !q.sending)?`
      <div style="padding:0 24px 24px;display:flex;gap:10px;align-items:center">
        ${canBack?`<button data-act="quizBack" style="height:52px;padding:0 20px;border-radius:999px;border:1.5px solid #0E3446;background:transparent;color:#0E3446;font-size:15px;font-weight:700">Back</button>`:''}
        <button data-act="quizNext" style="flex:1;height:52px;border-radius:999px;border:none;background:#0E3446;color:#FFFFFF;font-size:15px;font-weight:700">${nextLabel}</button>
      </div>`:''}
    </div>
  </div>`;
}

/* ---------- event delegation ---------- */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if (!el) return;
  e.preventDefault();
  const act = el.getAttribute('data-act');
  const arg = el.getAttribute('data-arg');
  switch(act){
    case 'openQuiz': openQuiz(arg); break;
    case 'hwToggle': hwToggle(arg); break;
    case 'openPV': openPV(arg); break;
    case 'closePV': closePV(); break;
    case 'pvDuration': pvDuration(arg); break;
    case 'pvAddon': pvAddon(arg); break;
    case 'pvContinue': pvContinue(); break;
    case 'closeQuiz': closeQuiz(); break;
    case 'openLogin': openLogin(); break;
    case 'closeLogin': closeLogin(); break;
    case 'openApply': openApply(); break;
    case 'closeApply': closeApply(); break;
    case 'openCgLogin': openCgLogin(); break;
    case 'faqToggle': setState(s=>({faqOpen: s.faqOpen===Number(arg) ? -1 : Number(arg)})); break;
    case 'apRole': setAp({role:arg}); break;
    case 'apYrs': setAp({yrs:arg}); break;
    case 'apDoc': setAp(a=>({docs: a.docs.includes(arg) ? a.docs.filter(x=>x!==arg) : [...a.docs, arg]})); break;
    case 'apNext': apNext(); break;
    case 'apBack': apBack(); break;
    case 'apToApp': apToApp(); break;
    case 'lgRole': setLg({role:arg}); break;
    case 'submitLogin': submitLogin(); break;
    case 'sendOtp': sendOtp(); break;
    case 'verifyOtp': verifyOtp(); break;
    case 'lgBack': lgBack(); break;
    case 'forgotPw': forgotPw(); break;
    case 'lgNew': lgNew(); break;
    case 'qWho': setQ({who:arg}); break;
    case 'qArea': setQ({area:arg}); break;
    case 'qNeed': setQ(q=>({needs: q.needs.includes(arg) ? q.needs.filter(n=>n!==arg) : [...q.needs, arg]})); break;
    case 'qPlan': setQ({plan:arg}); break;
    case 'qDuration': setQ({duration:arg}); break;
    case 'qTos': setQ(q=>({tos: !q.tos})); break;
    case 'quizNext': quizNext(); break;
    case 'quizBack': quizBack(); break;
  }
});

function bindInputs(){
  const map = [
    ['ap_name', v=>setAp({name:v})], ['ap_phone', v=>setAp({phone:v})], ['ap_city', v=>setAp({city:v})],
    ['lg_id', v=>setLg({id:v})], ['lg_pw', v=>setLg({pw:v})], ['lg_code', v=>setLg({code:v.replace(/\D/g,'').slice(0,6)})],
    ['q_name', v=>setQ({name:v})], ['q_email', v=>setQ({email:v})], ['q_phone', v=>setQ({phone:v})], ['q_country', v=>setQ({country:v})]
  ];
  map.forEach(([id, fn])=>{
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input', ()=>{ fn(el.value); refocus(id); });
  });
}
let _lastFocus = null, _lastSel = null;
function refocus(id){
  _lastFocus = id;
  const el = document.getElementById(id);
  _lastSel = el ? el.selectionStart : null;
}
const _origRender = render;
render = function(){
  _origRender();
  if (_lastFocus){
    const el = document.getElementById(_lastFocus);
    if (el){ el.focus(); if (_lastSel!=null && el.setSelectionRange) try{ el.setSelectionRange(_lastSel,_lastSel); }catch(e){} }
  }
};

window.addEventListener('resize', ()=>{ setState({wide: window.innerWidth>=900}); });
window.addEventListener('scroll', ()=>{
  const sc = window.scrollY > 520;
  if (sc !== state.scrolled) setState({scrolled: sc});
}, {passive:true});

render();
</script>
</body>
