<title>Kalinga — Vetted local caregivers for your parents</title>
<meta name="description" content="Scheduled caregiver visits for elderly parents in the Philippines. Local, vetted, and fully on record.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#F6F1E7;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0E2A38;-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  a{color:#0E3446;text-decoration:none}
  a:hover{color:#3E7C93}
  button{font-family:inherit;cursor:pointer}
  h1,h2,h3,p{margin:0}
  html{scroll-behavior:smooth}
  .img-slot{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:inherit;color:rgba(14,42,56,.35);font-size:12px;font-weight:600;text-align:center;padding:12px;line-height:1.4}
  .cg-strip{scrollbar-width:none}
  .cg-strip::-webkit-scrollbar{display:none}
  input:focus{border-color:#0E3446!important}
  @keyframes gpsping{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.8);opacity:0}}

</style>

<div id="app"></div>

<script>
/* ---------- data ---------- */
const WHO = [['nanay','Nanay'],['tatay','Tatay'],['lola','Lola'],['lolo','Lolo'],['both','Both parents']];
const AREAS = [['mm','Metro Manila'],['bulacan','Bulacan'],['other','Somewhere else']];
const NEEDS = [['meds','Medication check'],['vitals','Blood pressure & wellbeing'],['meals','Meals & hydration'],['errands','Groceries & errands'],['doctor','Doctor visit companion'],['company','Companionship']];
const DURATIONS = [
  {id:'short',label:'1–2 hour visit',sub:'A quick check-in',rate:450},
  {id:'half',label:'Half-day visit',sub:'4 hours, AM or PM',rate:950},
  {id:'full',label:'Whole-day visit',sub:'8 hours',rate:1700},
  {id:'overnight',label:'Overnight visit',sub:'12 hours, incl. night differential',rate:2200}

const PLANS = {
  basic:{name:'Basic',freq:'Once a week',visits:4},
  standard:{name:'Standard',freq:'Twice a week',visits:8},
  premium:{name:'Premium',freq:'Every day',visits:30}
};
const TIERS = [
  {id:'basic',code:'BASIC',tagline:'A weekly check-in',title:'Once a week',big:'1×',bigSub:'visit / week',desc:'A visit each week with the same caregiver. Good for someone who is independent but lives alone.',feats:['Checklist + photos every visit','Message your caregiver','Emergency alerts (push + SMS)']},
  {id:'standard',code:'STANDARD',tagline:'Steady, regular care',title:'Twice a week',big:'2×',bigSub:'visits / week',desc:'Two visits a week with the same caregiver. Most families choose this one.',feats:['Photos + video every visit','Backup caregiver if they cancel','Up to 4 family members linked']},
  {id:'premium',code:'PREMIUM',tagline:'Someone there daily',title:'Every day',big:'7×',bigSub:'visits / week',desc:'A visit every day of the week. For a loved one who needs a closer eye or is recovering from an illness.',feats:['Daily visits, Mon–Sun','Priority backup caregiver','Video call during visits']}
];
function peso(n){ return '₱'+Math.round(n).toLocaleString('en-PH'); }
function priceFor(tierId, durId){
  const t = PLANS[tierId] || PLANS.basic, d = DURATIONS.find(x=>x.id===durId) || DURATIONS[0];
  return t.visits * d.rate;
}
const HARDWARE = [
  {id:'tag',t:'Safety tag',b:'A GPS pendant with fall detection, an SOS button and safe-zone alerts.'},
  {id:'camera',t:'Home camera',b:'Covers common areas only. Only the primary account holder can view it.'},
  {id:'bodycam',t:'Caregiver body cam',b:'Worn only during visits. Footage is opened only if there is a formal dispute.'}
];
const HARDWARE_PRODUCTS = {
  tag: [
    {id:'tag-basic',t:'Basic GPS Tag',b:'Fall detection, SOS button, safe-zone alerts.',price:'₱1,990',sub:'one-time, or ₱199/mo over 12 months'},
    {id:'tag-plus',t:'GPS Tag Plus',b:'Adds heart-rate monitoring and a 2-week battery life.',price:'₱2,990',sub:'one-time, or ₱299/mo over 12 months'}
  ],
  camera: [
    {id:'cam-standard',t:'Standard Home Camera',b:'1080p with night vision, covers one common area.',price:'₱2,490',sub:'one-time, or ₱249/mo over 12 months'},
    {id:'cam-pro',t:'Pro Home Camera',b:'2K resolution, two-way audio, wider field of view.',price:'₱3,490',sub:'one-time, or ₱349/mo over 12 months'}
  ],
  bodycam: [
    {id:'bc-standard',t:'Standard Body Cam',b:'Worn during visits only. Footage reviewed only in a formal dispute.',price:'₱149/mo',sub:'billed with your plan'},
    {id:'bc-live',t:'Body Cam + Live Audio',b:'Adds an on-request live audio check-in during the visit.',price:'₱249/mo',sub:'billed with your plan'}
  ]
};
const ALL_PRODUCTS = Object.values(HARDWARE_PRODUCTS).flat();
function categoryOfProduct(productId){ return Object.keys(HARDWARE_PRODUCTS).find(cat=>HARDWARE_PRODUCTS[cat].some(p=>p.id===productId)); }
function selectedProductFor(catId, addons){ return HARDWARE_PRODUCTS[catId].find(p=>addons.includes(p.id)); }
function cheapestLabel(catId){ const prices = HARDWARE_PRODUCTS[catId].map(p=>parseInt(p.price.replace(/[^\d]/g,''),10)); return 'From ₱'+Math.min(...prices).toLocaleString('en-PH')+(HARDWARE_PRODUCTS[catId][0].sub.includes('/mo')&&!HARDWARE_PRODUCTS[catId][0].sub.includes('one-time')?'/mo':''); }
const CAREGIVERS = [
  {name:'Joy Santos',meta:'Quezon City, Metro Manila · 6 yrs'},
  {name:'Ramon Villareal',meta:'Makati, Metro Manila · 4 yrs'},
  {name:'Grace Tan',meta:'Malolos, Bulacan · 5 yrs'},
  {name:'Arnel Bautista',meta:'Meycauayan, Bulacan · 7 yrs'},
  {name:'Marites Ocampo',meta:'Taguig, Metro Manila · 8 yrs'},
  {name:'Jenny Aquino',meta:'San Jose del Monte, Bulacan · 3 yrs'}
];
const NURSES_LIVE = false;
const VISITS = [
  {tin:'9:14',tout:'10:32',tags:['Meds taken','BP 128/82','Groceries'],note:'Nanay Remy ate all her lunch today and we walked to the sari-sari store. She asked if you will call on Saturday.',by:'Joy, visiting Nanay Remy · Quezon City'},
  {tin:'2:00',tout:'3:10',tags:['Meds taken','BP 135/86','Pharmacy'],note:'Tatay Ben picked up his refill from Mercury Drug with me. His knee was a little sore, so I let his daughter know.',by:'Arnel, visiting Tatay Ben · Meycauayan, Bulacan'},
  {tin:'8:30',tout:'9:25',tags:['Meds taken','Breakfast','Video call'],note:'Lola Cora watched the video call with her apo abroad and was so happy. She asked me to send the photo to the family.',by:'Marites, visiting Lola Cora · Taguig'}
];
const PROMISES = ['Backup caregiver','Next visit free','Cancel anytime','Locked visit records'];
const FAQS = [
  ['Who are the caregivers?','They are local, TESDA-trained caregivers and PRC-licensed, board-passer nurses who live near your loved one. Before they can take a booking, each one passes an NBI clearance, ID and reference checks, first-aid/CPR verification and an in-person interview.'],
  ['Is Kalinga a medical service?','No. Our caregivers do scheduled, non-medical check-in visits. If something looks wrong, they follow our emergency protocol. That means calling 911 when it is needed, alerting your family, and notifying our team.'],
  ['What if the caregiver can’t come?','We send a vetted backup caregiver and tell you right away. If no backup is available, your next visit is free.'],
  ['Can my siblings see the visits?','Yes. Each linked family member has their own login and gets their own alerts. Only the primary account holder can manage billing.'],
  ['How do I pay from abroad?','You can pay by card (Visa or Mastercard) or with Wise in your own currency. If you prefer pesos, you can use GCash or Maya. You are billed monthly, and every charge is listed on your invoice.'],
  ['Is my family’s information private?','Yes. Medical notes and emergency contacts are encrypted. Only your parent’s assigned caregiver and the family members you link can see them. We follow the Data Privacy Act (RA 10173).'],
  ['Where are you available?','We are starting in Metro Manila and Bulacan. If your parent lives somewhere else, start a care match anyway and we will let you know when we reach their area.'],
  ['Can I cancel or pause my plan?','Yes. You can do it anytime in the app, and the change applies from your next billing cycle.']
];
const FOOT_COLS = [
  {h:'Company',links:[{t:'About us',href:'#'},{t:'How it works',href:'#how'},{t:'Start a care match',href:'#top'},{t:'Contact',href:'mailto:hello@kalinga.ph'}]},
  {h:'Plans',links:[{t:'Basic',href:'#plans'},{t:'Standard',href:'#plans'},{t:'Premium',href:'#plans'},{t:'Safety devices',href:'#plans'}]},
  {h:'Support',links:[{t:'Become a caregiver',act:'openApply'},{t:'Caregiver log in',act:'openCgLogin'},{t:'Privacy policy',act:'openLegal',arg:'privacy'},{t:'Terms of service',act:'openLegal',arg:'terms'},{t:'Emergency protocol',act:'openLegal',arg:'emergency'}]}
];
const JOIN_PERKS = ['Visits near home, scheduled around your family','Weekly pay, your choice of payout method — no agency cut','Free first-aid, CPR and dementia-care training'];
const JOIN_STEPS = [['1','Apply online','About 5 minutes. Your name, mobile number, location and experience.'],['2','Send your documents','Valid ID, NBI clearance, barangay clearance, plus your TESDA NC II or PRC license if you have one.'],['3','Interview and orientation','A short video or in-person interview, then a half-day orientation.'],['4','Start receiving visits','Log in to the Kalinga app and accept visits from families nearby.']];
const AP_DOCS = [{id:'id',t:'Valid government ID',req:true},{id:'nbi',t:'NBI clearance',req:true},{id:'brgy',t:'Barangay clearance',req:true},{id:'prc',t:'PRC nursing license',req:true},{id:'tesda',t:'TESDA Caregiving NC II',req:false},{id:'cpr',t:'First-aid or CPR certificate',req:false}];
const LEGAL = {
  privacy: {t:'Privacy policy', body:[
    'Kalinga collects only what we need to arrange and verify caregiver visits: your contact details, your loved one’s name and address, care notes, and the caregiver’s verification documents.',
    'We never sell personal data. Information is shared only with the caregiver assigned to a visit, and with payment processors needed to run payouts.',
    'All data is handled in line with the Philippine Data Privacy Act of 2012 (RA 10173). You can request a copy of your data or ask us to delete it at any time by emailing hello@kalinga.ph.',
    'This is a summary for our pre-launch site. A full, lawyer-reviewed policy will replace this before Kalinga opens to paying families.'
  ]},
  terms: {t:'Terms of service', body:[
    'Kalinga arranges scheduled check-in visits by independent, vetted caregivers and nurses. Visits are companionship, light assistance and wellness check-ins — they are not medical treatment.',
    'Plans are billed monthly with no long-term contract; you can pause or cancel from your next billing cycle. Our missed-visit guarantee means we send a backup caregiver at no extra cost if a scheduled visit is missed.',
    'Caregivers accept visits as independent service providers, not Kalinga employees. Each one passes an NBI and barangay clearance check before their first booking.',
    'This is a summary for our pre-launch site. Full terms will be published before Kalinga opens to paying families.'
  ]},
  emergency: {t:'Emergency protocol', body:[
    'Kalinga is not a medical provider or an emergency service. In a medical emergency, call 911 (or your local emergency number) first.',
    'If a caregiver notices a health concern during a visit, they are trained to contact the family’s emergency contact immediately and to call emergency services if the situation looks urgent.',
    'Every visit log includes a timestamped note, so families always know what happened and when. Serious incidents are also escalated to the Kalinga team the same day.',
    'We are finalizing a detailed, step-by-step protocol with a licensed nurse-consultant ahead of launch.'
  ]}
};

/* ---------- state ---------- */
const blankAp = () => ({open:false,step:0,role:'caregiver',name:'',phone:'',city:'',yrs:null,docs:[],err:'',ref:''});
const blankLg = () => ({role:'family',id:'',pw:'',code:'',mode:'form',err:'',info:'',loading:false});
const blankQ = () => ({step:0,who:null,area:null,needs:[],plan:null,duration:null,addons:[],name:'',email:'',phone:'',country:'',tos:false,err:'',sending:false});

let state = {
  wide: window.innerWidth >= 900,
  scrolled: window.scrollY > 520,
  quizOpen:false, q:blankQ(),
  loginOpen:false, lg:blankLg(),
  ap:blankAp(),
  faqOpen:-1,
  addons:[],
  pv:{open:false, tierId:null, duration:null, addons:[]},
  hwPicker:{open:false, categoryId:null, context:'main'},
  legalOpen:null,
  chat:{open:false, draft:'', typing:false, messages:[
    {from:'bot', text:"Hi, I'm the Kalinga assistant. Ask me about plans, visits, or your care match — if I can't help, a team member will follow up by email."}
  ]}
};
let _t;

function setState(patch){ state = {...state, ...(typeof patch==='function'?patch(state):patch)}; render(); }
function setQ(p){ setState(s=>({q:{...s.q, err:'', ...(typeof p==='function'?p(s.q):p)}})); }
function setAp(p){ setState(s=>({ap:{...s.ap, err:'', ...(typeof p==='function'?p(s.ap):p)}})); }
function setLg(p){ setState(s=>({lg:{...s.lg, err:'', ...(typeof p==='function'?p(s.lg):p)}})); }
function openLegal(id){ setState({legalOpen:id}); }
function closeLegal(){ setState({legalOpen:null}); }

function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- actions ---------- */
function openQuiz(plan){ setState(s=>({quizOpen:true, q:{...blankQ(), plan:plan||null, addons:[...s.addons]}})); }
function openHwPicker(catId, context){ setState({hwPicker:{open:true, categoryId:catId, context}}); }
function closeHwPicker(){ setState(s=>({hwPicker:{...s.hwPicker, open:false}})); }
function selectHwProduct(productId){
  const catId = categoryOfProduct(productId);
  const catIds = HARDWARE_PRODUCTS[catId].map(p=>p.id);
  const toggle = list => { const rest = list.filter(id=>!catIds.includes(id)); return list.includes(productId) ? rest : [...rest, productId]; };
  setState(s=>{
    const patch = { hwPicker:{...s.hwPicker, open:false} };
    if (s.hwPicker.context==='pv') patch.pv = {...s.pv, addons: toggle(s.pv.addons)};
    else patch.addons = toggle(s.addons);
    return patch;
  });
}
function openPV(tierId){ setState(s=>({pv:{open:true, tierId, duration:null, addons:[...s.addons]}})); }
function closePV(){ setState(s=>({pv:{...s.pv, open:false}})); }
function pvDuration(id){ setState(s=>({pv:{...s.pv, duration:id}})); }
function toggleChat(){ setState(s=>({chat:{...s.chat, open:!s.chat.open}})); }
function setChatDraft(v){ setState(s=>({chat:{...s.chat, draft:v}})); }
function sendChatMsg(){
  const s = state;
  const text = s.chat.draft.trim();
  if (!text) return;
  const reply = "Thanks for your message — a Kalinga team member will follow up by email or SMS, usually within a few hours. For anything urgent, email hello@kalinga.ph.";
  setState(s2=>({chat:{...s2.chat, draft:'', typing:true, messages:[...s2.chat.messages, {from:'user', text}]}}));
  clearTimeout(_t);
  _t = setTimeout(()=>{
    setState(s3=>({chat:{...s3.chat, typing:false, messages:[...s3.chat.messages, {from:'bot', text:reply}]}}));
  }, 1100);
}
function pvContinue(){
  setState(s=>({
    pv:{...s.pv, open:false},
    addons:[...s.pv.addons],
    quizOpen:true,
    q:{...blankQ(), plan:s.pv.tierId, duration:s.pv.duration, addons:[...s.pv.addons]}
  }));
}
function closeQuiz(){ setState({quizOpen:false}); }
function openLogin(){ setState({loginOpen:true, lg:blankLg()}); }
function closeLogin(){ setState({loginOpen:false}); }
function openApply(){ setState({ap:{...blankAp(), open:true}}); }
function closeApply(){ setState(s=>({ap:{...s.ap, open:false}})); }
function openCgLogin(){ setState({loginOpen:true, lg:{...blankLg(), role:'caregiver'}}); }

function quizNext(){
  const q = state.q;
  if (q.step===0 && (!q.who || !q.area)) return setQ({err:"Choose who we're visiting and where they live."});
  if (q.step===1 && !q.needs.length) return setQ({err:'Choose at least one.'});
  if (q.step===2 && !q.plan) return setQ({err:'Choose how often.'});
  if (q.step===2 && !q.duration) return setQ({err:'Choose how long each visit should be.'});
  if (q.step===3){
    if (!q.name.trim() || !q.email.trim() || !q.phone.trim() || !q.country.trim()) return setQ({err:'Please fill in every field.'});
    if (!/^\S+@\S+\.\S+$/.test(q.email.trim())) return setQ({err:'Check your email address.'});
    if (!q.tos) return setQ({err:'Please agree to the Terms to continue.'});
    setQ({sending:true});
    clearTimeout(_t);
    _t = setTimeout(()=>{
      try{
        const list = JSON.parse(localStorage.getItem('kalinga_matches')||'[]');
        list.push({...q, ts:new Date().toISOString()});
        localStorage.setItem('kalinga_matches', JSON.stringify(list));
      }catch(e){}
      setQ({sending:false, step:4});
    }, 1200);
    return;
  }
  setQ({step:q.step+1});
}
function quizBack(){ setQ(q=>({step:Math.max(0,q.step-1)})); }

function apNext(){
  const a = state.ap;
  if (a.step===0){
    if (a.name.trim().split(/\s+/).length < 2) return setAp({err:'Enter your first and last name.'});
    if (a.phone.replace(/\D/g,'').length < 10) return setAp({err:'Enter a valid mobile number.'});
    if (!a.city.trim()) return setAp({err:'Enter your city or municipality.'});
    if (!a.yrs) return setAp({err:'Choose your years of experience.'});
    return setAp({step:1});
  }
  const need = AP_DOCS.filter(d=>d.req && (d.id!=='prc' || a.role==='nurse')).map(d=>d.id);
  if (need.some(id=>!a.docs.includes(id))) return setAp({err:'Upload all required documents.'});
  setAp({step:2, ref:'CG-'+String(Date.now()).slice(-5)});
}
function apBack(){ setAp({step:0}); }
function apToggleDoc(id, on, docs){ setAp({docs: on ? docs.filter(x=>x!==id) : [...docs, id]}); }

function submitLogin(){
  const lg = state.lg;
  if (!lg.id.trim()) return setLg({err:'Enter your email or mobile number.'});
  if (lg.pw.length < 6) return setLg({err:'Password must be at least 6 characters.'});
  finishLogin();
}
function finishLogin(){
  const lg = state.lg;
  setLg({loading:true, mode:'loading', info:''});
  try{ localStorage.setItem('kalinga_session', JSON.stringify({id:lg.id.trim(), role:lg.role, ts:new Date().toISOString()})); }catch(e){}
  clearTimeout(_t);
  _t = setTimeout(()=>{ alert('Demo: this would continue into the Kalinga app (' + (lg.role==='caregiver'?'caregiver':'family') + ' view).'); setState({loginOpen:false}); }, 700);
}
function sendOtp(){ state.lg.id.trim() ? setLg({mode:'otp', info:''}) : setLg({err:'Enter your email or mobile number first.'}); }
function verifyOtp(){ state.lg.code.length===6 ? finishLogin() : setLg({err:'Enter the 6-digit code.'}); }
function lgBack(){ setLg({mode:'form', code:''}); }
function forgotPw(){ state.lg.id.trim() ? setLg({info:'Reset link sent to '+state.lg.id.trim()+'.'}) : setLg({err:'Enter your email or mobile number first.'}); }
function lgNew(){ state.lg.role==='caregiver' ? setState({loginOpen:false, ap:{...blankAp(), open:true}}) : setState({loginOpen:false, quizOpen:true, q:blankQ()}); }
function apToApp(){ try{ localStorage.setItem('kalinga_session', JSON.stringify({id:state.ap.phone, role:'caregiver', applicant:true, ts:new Date().toISOString()})); }catch(e){} alert('Demo: this would continue into the caregiver app.'); }

/* ---------- small render helpers ---------- */
function pill(label,on,onClick,extra){
  return `<button data-act="${onClick}" ${extra||''} style="height:48px;padding:0 20px;border-radius:999px;border:1.5px solid ${on?'#0E3446':'#DED6C7'};background:${on?'#0E3446':'#FFFFFF'};color:${on?'#FFFFFF':'#0E3446'};font-size:15px;font-weight:600">${esc(label)}</button>`;
}

/* ---------- render ---------- */
function render(){
  const s = state, q = s.q, lg = s.lg, a = s.ap;
  const plan = PLANS[q.plan] || PLANS.standard;
  const barCta = s.scrolled && s.wide;

  const html = `
  <div style="min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden">

  <header style="position:sticky;top:0;z-index:30;background:rgba(246,241,231,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(14,52,70,.08)">
    <div style="max-width:1200px;margin:0 auto;padding:0 24px;height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px">
      <a href="#top" style="font-size:26px;font-weight:700;letter-spacing:-.03em;color:#0E3446">kalinga</a>
      ${s.wide && !s.scrolled ? `
      <nav style="display:flex;gap:30px;font-size:15px;font-weight:600">
        <a href="#how">How it works</a><a href="#visits">Visits</a><a href="#plans">Plans</a><a href="#faq">FAQs</a>
      </nav>` : barCta ? `
      <div style="display:flex;align-items:center;gap:14px">
        ${s.wide?`<span style="font-size:14px;font-weight:600">Find a caregiver for your parent</span>`:''}
        <button data-act="openQuiz" style="height:38px;padding:0 18px;border-radius:999px;border:none;background:#0E3446;color:#FFFFFF;font-size:14px;font-weight:700">Start care match</button>
      </div>` : `<span></span>`}
      <div style="display:flex;justify-content:flex-end;align-items:center;gap:18px;font-size:15px;font-weight:600">
        <a href="#join" style="color:#3E7C93;font-size:15px;font-weight:600;text-decoration:none">For caregivers</a>
        <button data-act="openLogin" style="background:none;border:none;padding:8px 0;font-size:15px;font-weight:600;color:#0E3446">Log in</button>
      </div>
    </div>
  </header>

  <section id="top" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));background:#F6F1E7">
    <div style="padding:clamp(40px,6vw,72px) clamp(24px,6vw,80px);display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:640px;width:100%">
      <span style="font-size:12px;font-weight:700;letter-spacing:.14em;color:#3E7C93">KALINGA · VETTED CAREGIVERS & NURSES</span>
      <h1 style="font-size:clamp(38px,4.8vw,60px);font-weight:600;line-height:1.08;letter-spacing:-.03em;color:#0E3446">Far from <em style="font-style:italic;color:#3E7C93">home</em>.<br>Never far from <em style="font-style:italic;color:#3E7C93">family</em>.</h1>
      <p style="font-size:17px;line-height:1.65;color:#2F4A57;max-width:500px">Answer a 2-minute care match and we'll match your loved one with an NBI-cleared, TESDA-trained caregiver — or a PRC-licensed, board-passer nurse — who lives nearby. They visit on the schedule you choose. After every visit you'll see GPS check-in times, photos and notes, no matter where in the world you are. Backed by our <strong style="color:#0E3446">missed-visit guarantee</strong>.</p>
      <div style="display:flex;flex-direction:column;gap:14px;align-items:flex-start">
        <button data-act="openQuiz" style="height:56px;padding:0 30px;border-radius:999px;border:none;background:#0E3446;color:#FFFFFF;font-size:16px;font-weight:700;box-shadow:0 8px 24px rgba(14,52,70,.25)">Start my care match →</button>
        <span style="font-size:14px;color:#2F4A57"><strong style="color:#0E3446">Founding-family pricing</strong> · No contract, cancel anytime</span>

      <div style="display:flex;flex-direction:column;gap:18px">
        <span style="font-size:12px;font-weight:700;letter-spacing:.14em;color:#BFDCE4">A NOTE FROM OUR FOUNDER</span>
        <h2 style="font-size:clamp(30px,4vw,46px);font-weight:600;letter-spacing:-.03em;line-height:1.12">Why we built <em style="font-style:italic;color:#F2B872">Kalinga</em>.</h2>
        <p style="font-size:16px;line-height:1.75;color:#DCEBEF">Millions of Filipinos work abroad to support the family back home. What many of us are missing is a way to know our parents are okay on the days we can't call. The relatives nearby help when they can, but their schedules change and you rarely get the full picture.</p>
        <p style="font-size:16px;line-height:1.75;color:#DCEBEF">Kalinga is built on one simple promise. A person you've chosen and we've vetted visits on the days you set, and after every visit you get a record you can trust. If they can't make it, we send a backup. If something's wrong, you hear about it first.</p>
        <div style="display:flex;flex-direction:column;gap:2px;padding-top:6px">
          <span style="font-size:17px;font-weight:700">Trixie Chan</span>
          <span style="font-size:14px;color:#BFDCE4">Founder, Kalinga</span>
        </div>
      </div>

  <section style="position:relative;background:linear-gradient(180deg,#1F5A70 0%,#2F6D85 100%);color:#FFFFFF;overflow:hidden">
    <div style="position:absolute;inset:0;opacity:.35"><div class="img-slot"></div></div>
    <div style="position:relative;max-width:760px;margin:0 auto;padding:88px 24px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;pointer-events:none">
      <div style="width:86px;height:96px;background:#0E3446;border:2px solid #BFDCE4;clip-path:polygon(50% 0,100% 18%,100% 62%,50% 100%,0 62%,0 18%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0">
        <span style="font-size:11px;font-weight:700;letter-spacing:.1em;color:#BFDCE4">MISSED</span>
        <span style="font-size:11px;font-weight:700;letter-spacing:.1em;color:#BFDCE4">VISIT</span>
        <span style="font-size:13px;font-weight:700;color:#F2B872">FREE</span>
      </div>
      <span style="font-size:12px;font-weight:700;letter-spacing:.14em;color:#DCEBEF">OUR PROMISE</span>
      <h2 style="font-size:clamp(32px,4.4vw,50px);font-weight:600;letter-spacing:-.03em;line-height:1.1">A visit missed? <em style="font-style:italic;color:#F2B872">The next one's on us.</em></h2>
      <p style="font-size:16px;line-height:1.65;color:#EAF3F5;max-width:560px">If your caregiver cancels, we'll send a vetted backup and let you know right away. If no one can make it, your next visit is free. You don't need to file a claim or argue about it.</p>
      <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding-top:6px">
        ${PROMISES.map(p=>`<span style="background:#FFFFFF;color:#0E3446;font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px">✓ ${esc(p)}</span>`).join('')}
      </div>
      <span style="font-size:14px;color:#EAF3F5">Questions? Email <span style="text-decoration:underline">hello@kalinga.ph</span> and a person will reply.</span>
    </div>
  </section>

  <section id="faq" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));background:#F6F1E7">
    <div style="padding:64px clamp(24px,5vw,72px);display:flex;flex-direction:column;gap:20px;max-width:680px;width:100%">
      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:12px;font-weight:700;letter-spacing:.14em;color:#3E7C93">QUESTIONS</span>
        <h2 style="font-size:clamp(26px,3vw,34px);font-weight:600;letter-spacing:-.02em;color:#0E3446">Frequently asked <em style="font-style:italic;color:#3E7C93">questions</em>.</h2>
      </div>
      <div style="display:flex;flex-direction:column">
        ${FAQS.map((f,i)=>`
        <div style="border-top:1px solid #DED6C7">
          <button data-act="faqToggle" data-arg="${i}" style="width:100%;background:transparent;border:none;padding:18px 0;display:flex;justify-content:space-between;gap:16px;text-align:left;color:#0E3446;align-items:center">
            <span style="font-size:15px;font-weight:600;line-height:1.4">${esc(f[0])}</span>
            <span style="font-size:20px;color:#3E7C93;flex-shrink:0">${s.faqOpen===i?'−':'+'}</span>
          </button>
          ${s.faqOpen===i?`<p style="font-size:15px;line-height:1.65;color:#2F4A57;padding:0 32px 18px 0">${esc(f[1])}</p>`:''}
        </div>`).join('')}
      </div>
      <span style="font-size:14px;color:#2F4A57">Still have questions? <a href="mailto:hello@kalinga.ph" style="font-weight:700;text-decoration:underline">Message us</a> or <button data-act="openQuiz" style="background:none;border:none;padding:0;font-size:14px;font-weight:700;color:#0E3446;text-decoration:underline">start a care match</button>.</span>
    </div>
    <div style="position:relative;min-height:440px;background:#E7DFD0;display:flex;align-items:center;justify-content:center;padding:40px 24px">
      <div style="display:flex;flex-direction:column;gap:14px;max-width:380px;width:100%">
        <span style="font-size:12px;font-weight:700;letter-spacing:.14em;color:#3E7C93;text-align:center">WHY FAMILIES TRUST KALINGA</span>
        ${[
          ['NBI-cleared & TESDA-trained','Every caregiver is background-checked and trained before their first visit.'],
          ['GPS-verified visits','Check-in and check-out times are logged automatically — no guessing.'],
          ['Missed-visit guarantee','If a caregiver cancels, we send a backup at no extra cost.'],
          ['Notes after every visit','Photos and a short update land in your inbox, wherever you are.']
        ].map(([t,b])=>`
        <div style="background:#FFFFFF;border-radius:16px;padding:16px 18px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 6px 18px rgba(14,42,56,.08)">
          <span style="width:28px;height:28px;border-radius:50%;background:#0E3446;color:#F2B872;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">✓</span>
          <span style="display:flex;flex-direction:column;gap:2px">
            <span style="font-size:14px;font-weight:700;color:#0E3446">${t}</span>
            <span style="font-size:13px;line-height:1.5;color:#5C7480">${b}</span>
          </span>
        </div>`).join('')}
      </div>
    </div>
  </section>

  <section id="join" style="background:#FFFFFF;padding:88px 24px">
    <div style="max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;align-items:center">
      <div style="display:flex;flex-direction:column;gap:18px">
        <span style="font-size:12px;font-weight:700;letter-spacing:.14em;color:#3E7C93">FOR CAREGIVERS AND NURSES</span>
        <h2 style="margin:0;font-size:clamp(30px,4vw,46px);font-weight:600;letter-spacing:-.03em;line-height:1.12;color:#0E3446">Care for elderly Filipinos <em style="font-style:italic;color:#3E7C93">near you</em>.</h2>
        <p style="margin:0;font-size:17px;line-height:1.6;color:#2F4A57">Work in your own barangay on a schedule you choose. Kalinga sends you visits, pays you every week, and gives every caregiver free first-aid and dementia-care training.</p>
        <div style="display:flex;flex-direction:column;gap:10px">
          ${JOIN_PERKS.map(p=>`<div style="display:flex;gap:12px;align-items:flex-start"><span style="width:24px;height:24px;border-radius:50%;background:#E3EFF2;color:#0E3446;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">✓</span><span style="font-size:16px;line-height:1.5;color:#0E2A38">${esc(p)}</span></div>`).join('')}
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:12px;padding-top:6px">
          <button data-act="openApply" style="height:56px;padding:0 28px;border-radius:999px;border:none;background:#0E3446;color:#FFFFFF;font-size:16px;font-weight:700;box-shadow:0 10px 24px rgba(14,52,70,.25)">Apply as a caregiver →</button>
        </div>
      </div>
      <div style="background:#F6F1E7;border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:6px">
        <span style="font-size:13px;font-weight:700;letter-spacing:.08em;color:#3E7C93;padding-bottom:10px">HOW TO JOIN</span>
        ${JOIN_STEPS.map((j,i)=>`
        <div style="display:grid;grid-template-columns:44px 1fr;gap:14px;padding:12px 0;border-bottom:${i<3?'1px solid #E7DFD0':'none'}">
          <span style="width:44px;height:44px;border-radius:14px;background:#0E3446;color:#FFFFFF;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center">${j[0]}</span>
          <div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:17px;font-weight:700;color:#0E3446">${esc(j[1])}</span><span style="font-size:14px;line-height:1.5;color:#2F4A57">${esc(j[2])}</span></div>
        </div>`).join('')}
      </div>
    </div>
  </section>

  ${a.open ? renderApplyModal(a) : ''}

  <footer style="background:linear-gradient(135deg,#2F6D85 0%,#0E3446 55%,#0B2533 100%);color:#FFFFFF">
    <div style="max-width:1100px;margin:0 auto;padding:64px 24px 32px;display:flex;flex-direction:column;gap:40px">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:32px">
        <div style="display:flex;flex-direction:column;gap:14px">
          <span style="font-size:58px;font-weight:700;letter-spacing:-.05em;line-height:1">kalinga</span>
          <p style="font-size:14px;line-height:1.6;color:#DCEBEF;max-width:280px">Scheduled caregiver visits for elderly parents in the Philippines. Local, vetted and fully on record.</p>
        </div>
        ${FOOT_COLS.map(col=>`
        <div style="display:flex;flex-direction:column;gap:10px">
          <span style="font-size:14px;font-weight:700">${esc(col.h)}</span>
          ${col.links.map(l=> l.act

}

}

function renderQuizModal(q, plan){

        <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:700;color:#0E3446">Email</span><input id="q_email" value="${esc(q.email)}" placeholder="maria@email.com" style="height:50px;border-radius:14px;border:1.5px solid #DED6C7;background:#FFFFFF;padding:0 16px;font-size:16px;outline:none;color:#0E2A38;font-family:inherit"></label>

        <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:700;color:#0E3446">Where you live now</span><input id="q_country" value="${esc(q.country)}" placeholder="Dubai, UAE" style="height:50px;border-radius:14px;border:1.5px solid #DED6C7;background:#FFFFFF;padding:0 16px;font-size:16px;outline:none;color:#0E2A38;font-family:inherit"></label>
        <button data-act="qTos" style="display:flex;gap:12px;align-items:flex-start;background:transparent;border:none;padding:4px 0 0;text-align:left;color:#0E3446">
          <span style="width:22px;height:22px;border-radius:6px;border:1.5px solid #0E3446;background:${q.tos?'#0E3446':'#FFFFFF'};color:#FFFFFF;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0">${q.tos?'✓':''}</span>
          <span style="font-size:14px;line-height:1.5">I agree to the Terms of Service and Privacy Policy, including emergency protocol consent.</span>
        </button>`:''}
        ${q.step===4?(()=>{
          const dur = DURATIONS.find(d=>d.id===q.duration) || DURATIONS[0];
          const planTotal = priceFor(q.plan, q.duration);
          const addonItems = ALL_PRODUCTS.filter(p=>q.addons.includes(p.id));
          return `
        <h3 style="font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.15;color:#0E3446">Salamat, <em style="font-style:italic;color:#3E7C93">${esc(firstName)}</em>.</h3>
        <p style="font-size:16px;line-height:1.6;color:#2F4A57">We're matching caregivers for ${esc(whoLabel)} in ${esc(areaLabel)}. Within 24 hours we'll email up to 3 profiles to ${esc(q.email)}, and you choose who visits.</p>

          <div style="padding:16px 18px;display:flex;flex-direction:column;gap:10px">

              <span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:18px;font-weight:700;color:#0E3446">${plan.name} · ${esc(dur.label)}</span><span style="font-size:13px;color:#5C7480">${plan.freq}</span></span>
              <span style="font-size:24px;font-weight:700;color:#0E3446">${peso(planTotal)}<span style="font-size:13px;font-weight:500;color:#5C7480">/mo</span></span>

        <div style="background:#E3EFF2;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px">
          <span style="font-size:14px;font-weight:700;color:#0E3446">What happens next</span>
          <span style="font-size:13px;line-height:1.6;color:#2F4A57">The Kalinga app isn't live yet. We'll reach you by email and SMS at ${esc(q.phone || 'the number you gave')} with your caregiver matches and payment link — no app needed to get started.</span>

        <button data-act="closeQuiz" style="height:54px;border-radius:999px;background:#0E3446;color:#FFFFFF;font-size:16px;font-weight:700">Done</button>`;

        <button data-act="quizNext" style="flex:1;height:52px;border-radius:999px;border:none;background:#0E3446;color:#FFFFFF;font-size:15px;font-weight:700">${nextLabel}</button>
      </div>`:''}

/* ---------- event delegation ---------- */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if (!el) return;
  e.preventDefault();
  const act = el.getAttribute('data-act');
  const arg = el.getAttribute('data-arg');
  switch(act){
    case 'openQuiz': openQuiz(arg); break;
    case 'openHwPicker': { const [catId, context] = arg.split(':'); openHwPicker(catId, context); break; }
    case 'closeHwPicker': closeHwPicker(); break;
    case 'openLegal': openLegal(arg); break;
    case 'closeLegal': closeLegal(); break;
    case 'selectHwProduct': selectHwProduct(arg); break;
    case 'openPV': openPV(arg); break;
    case 'closePV': closePV(); break;
    case 'pvDuration': pvDuration(arg); break;
    case 'pvContinue': pvContinue(); break;
    case 'toggleChat': toggleChat(); break;
    case 'sendChatMsg': sendChatMsg(); break;
    case 'closeQuiz': closeQuiz(); break;
    case 'openLogin': openLogin(); break;
    case 'closeLogin': closeLogin(); break;
    case 'openApply': openApply(); break;
    case 'closeApply': closeApply(); break;
    case 'openCgLogin': openCgLogin(); break;
    case 'faqToggle': setState(s=>({faqOpen: s.faqOpen===Number(arg) ? -1 : Number(arg)})); break;
    case 'apRole': setAp({role:arg}); break;
    case 'apYrs': setAp({yrs:arg}); break;
    case 'apDoc': setAp(a=>({docs: a.docs.includes(arg) ? a.docs.filter(x=>x!==arg) : [...a.docs, arg]})); break;
    case 'apNext': apNext(); break;
    case 'apBack': apBack(); break;
    case 'apToApp': apToApp(); break;
    case 'lgRole': setLg({role:arg}); break;
    case 'submitLogin': submitLogin(); break;
    case 'sendOtp': sendOtp(); break;
    case 'verifyOtp': verifyOtp(); break;
    case 'lgBack': lgBack(); break;
    case 'forgotPw': forgotPw(); break;
    case 'lgNew': lgNew(); break;
    case 'qWho': setQ({who:arg}); break;
    case 'qArea': setQ({area:arg}); break;
    case 'qNeed': setQ(q=>({needs: q.needs.includes(arg) ? q.needs.filter(n=>n!==arg) : [...q.needs, arg]})); break;
    case 'qPlan': setQ({plan:arg}); break;
    case 'qDuration': setQ({duration:arg}); break;
    case 'qTos': setQ(q=>({tos: !q.tos})); break;
    case 'quizNext': quizNext(); break;
    case 'quizBack': quizBack(); break;
  }
});

function bindInputs(){
  // Text inputs mutate state directly WITHOUT triggering a re-render, so the
  // browser's native cursor/typing behavior is never disturbed. The state is
  // read when a button (Continue, Submit, etc.) is clicked, which re-renders.
  const direct = [
    ['ap_name', v=>{ state.ap.name = v; }], ['ap_phone', v=>{ state.ap.phone = v; }], ['ap_city', v=>{ state.ap.city = v; }],
    ['lg_id', v=>{ state.lg.id = v; }], ['lg_pw', v=>{ state.lg.pw = v; }],
    ['lg_code', (v,el)=>{ const clean = v.replace(/\D/g,'').slice(0,6); state.lg.code = clean; if (el.value !== clean) el.value = clean; }],
    ['q_name', v=>{ state.q.name = v; }], ['q_email', v=>{ state.q.email = v; }], ['q_phone', v=>{ state.q.phone = v; }], ['q_country', v=>{ state.q.country = v; }],
    ['chat_draft', v=>{ state.chat.draft = v; }]
  ];
  direct.forEach(([id, fn])=>{
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input', ()=>{ fn(el.value, el); });
  });
  const chatInput = document.getElementById('chat_draft');
  if (chatInput) chatInput.addEventListener('keydown', e=>{ if (e.key==='Enter') sendChatMsg(); });
  const chatScroll = document.getElementById('chat_scroll');
  if (chatScroll) chatScroll.scrollTop = chatScroll.scrollHeight;
}
window.addEventListener('resize', ()=>{ setState({wide: window.innerWidth>=900}); });
window.addEventListener('scroll', ()=>{
  const sc = window.scrollY > 520;
  if (sc !== state.scrolled) setState({scrolled: sc});
}, {passive:true});

render();
</script>
